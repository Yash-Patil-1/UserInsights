[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "userinsights"
version = "1.0.0"
description = "Web Analytics & User Behavior Analysis — E-commerce event analysis with cohort retention, conversion funnels, and RFM customer segmentation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Yash Patil"},
]
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "plotly>=5.15",
    "streamlit>=1.28",
    "scikit-learn>=1.2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Repository = "https://github.com/Yash-Patil-1/UserInsights"
Documentation = "https://github.com/Yash-Patil-1/UserInsights#readme"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
